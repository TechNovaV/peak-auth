<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đặt lại mật khẩu - PEAK!</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="peak-body">
    <main class="peak-split">
      <section class="peak-art" aria-hidden="true">
        <img src="images/left-bg.png" alt="" class="peak-art-img" draggable="false" />
      </section>

      <section class="peak-form-wrap">
        <div class="peak-card">
          <header class="peak-card-header">
            <img src="images/peak-logo.png" alt="PEAK!" class="peak-logo-img" />
            <p class="peak-subtitle" data-i18n="reset.subtitle">Đặt lại mật khẩu</p>
          </header>

          <form class="auth-form" id="resetForm" novalidate>
            <div id="tokenError" class="hidden peak-error-box"></div>

            <div class="field">
              <label for="password" data-i18n="reset.new_password">Mật khẩu mới</label>
              <input type="password" id="password" name="password" placeholder="Ít nhất 8 ký tự" data-i18n-placeholder="placeholder.password" minlength="8" required autocomplete="new-password" />
              <small class="error" id="passwordError"></small>
            </div>

            <div class="field">
              <label for="confirmPassword" data-i18n="field.confirm_password">Nhập lại mật khẩu</label>
              <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Nhập lại mật khẩu" data-i18n-placeholder="placeholder.confirm_password" minlength="8" required autocomplete="new-password" />
              <small class="error" id="confirmPasswordError"></small>
            </div>

            <button type="submit" class="btn-primary btn-neon" data-i18n="reset.btn">Đặt lại mật khẩu</button>

            <p class="auth-footer">
              <a href="index.html" class="link link-neon" data-i18n="common.back_login">Quay lại đăng nhập</a>
            </p>
          </form>
        </div>
      </section>
    </main>

    <script src="translations.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
