<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đặt lại mật khẩu - Social App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="auth-container">
      <section class="auth-card">
        <header class="auth-header">
          <h1 class="logo">SocialApp</h1>
          <p class="subtitle">Đặt lại mật khẩu</p>
        </header>

        <form class="auth-form" id="resetForm" novalidate>
          <div
            id="tokenError"
            class="hidden"
            style="
              margin-bottom: 16px;
              padding: 12px;
              background: #fef2f2;
              border-radius: 8px;
              color: #b91c1c;
              font-size: 14px;
            "
          ></div>

          <div class="field">
            <label for="password">Mật khẩu mới</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Ít nhất 8 ký tự"
              minlength="8"
              required
              autocomplete="new-password"
            />
            <small class="error" id="passwordError"></small>
          </div>

          <div class="field">
            <label for="confirmPassword">Nhập lại mật khẩu</label>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Nhập lại mật khẩu"
              minlength="8"
              required
              autocomplete="new-password"
            />
            <small class="error" id="confirmPasswordError"></small>
          </div>

          <button type="submit" class="btn-primary">Đặt lại mật khẩu</button>

          <p class="auth-footer">
            <a href="index.html" class="link">Quay lại đăng nhập</a>
          </p>
        </form>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
