<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PEAK!</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="app-body hidden" id="homeRoot">

  <!-- ============ TOP NAV ============ -->
  <header class="top-nav">
    <div class="nav-left">
      <a href="home.html" class="brand">
        <img src="images/peak-logo-trans.png" alt="PEAK!" class="brand-logo" />
      </a>
      <div class="search-box">
        <span class="search-icon">⌕</span>
        <input type="text" placeholder="Tìm kiếm trên PEAK!" data-i18n-placeholder="home.search_placeholder" />
      </div>
    </div>

    <nav class="nav-center">
      <a href="home.html" class="nav-tab active" title="Trang chủ" data-i18n-title="home.nav.home">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span class="nav-tab-label" data-i18n="home.nav.home">Trang chủ</span>
      </a>
      <a href="#" class="nav-tab" id="locketTab" title="Locket">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
        <span class="nav-tab-label">Locket</span>
      </a>
    </nav>

    <div class="nav-right">
      <button class="icon-btn" title="Tin nhắn" data-i18n-title="home.nav.messages">✉</button>
      <button class="icon-btn" title="Thông báo" data-i18n-title="home.nav.notifications">🔔</button>
      <div class="avatar-menu">
        <button class="avatar-btn" id="avatarBtn" title="Tài khoản" data-i18n-title="home.nav.account">
          <img id="navAvatar" alt="avatar" />
        </button>
        <div class="dropdown hidden" id="avatarDropdown">
          <div class="dropdown-header">
            <img id="dropdownAvatar" alt="avatar" />
            <div>
              <div class="dd-name" id="dropdownName"></div>
              <div class="dd-email" id="dropdownEmail"></div>
            </div>
          </div>
          <hr />
          <a href="profile.html" class="dropdown-item">
            <span class="dd-icon">👤</span>
            <span data-i18n="home.dropdown.profile">Trang cá nhân</span>
          </a>
          <a href="#" class="dropdown-item">
            <span class="dd-icon">⚙</span>
            <span data-i18n="home.dropdown.settings">Cài đặt</span>
          </a>
          <a href="#" class="dropdown-item">
            <span class="dd-icon">?</span>
            <span data-i18n="home.dropdown.help">Trợ giúp</span>
          </a>
          <hr />
          <button class="dropdown-item logout" id="logoutBtn">
            <span class="dd-icon">⏻</span>
            <span data-i18n="common.logout">Đăng xuất</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- ============ MAIN LAYOUT ============ -->
  <div class="layout">

    <!-- LEFT SIDEBAR -->
    <aside class="sidebar sidebar-left">
      <a href="profile.html" class="side-item side-profile">
        <img id="sideAvatar" class="side-avatar" alt="" />
        <span id="sideName" class="side-name">Bạn</span>
      </a>
      <div class="side-divider"></div>
      <a href="#" class="side-item">
        <span class="side-icon">👥</span>
        <span data-i18n="home.sidebar.friends">Bạn bè</span>
      </a>
      <a href="#" class="side-item">
        <span class="side-icon">🔖</span>
        <span data-i18n="home.sidebar.saved">Đã lưu</span>
      </a>
    </aside>

    <!-- FEED -->
    <main class="feed">
      <!-- Composer -->
      <section class="composer-card">
        <form id="composerForm">
          <div class="composer-top">
            <img id="composerAvatar" class="composer-avatar" alt="" />
            <textarea
              id="composerInput"
              placeholder="Bạn đang nghĩ gì thế?"
              data-i18n-placeholder="home.composer.placeholder"
              maxlength="1000"
              rows="2"
            ></textarea>
          </div>
          <div class="composer-footer">
            <span id="composerCharCount" class="char-count">0 / 1000</span>
            <button type="submit" class="btn-post" id="composerSubmit" data-i18n="home.composer.post">Đăng</button>
          </div>
        </form>
      </section>

      <!-- Posts -->
      <div id="postsContainer">
        <p id="postsLoading" class="feed-status" data-i18n="home.posts.loading">Đang tải bài viết...</p>
      </div>
    </main>

    <!-- RIGHT SIDEBAR -->
    <aside class="sidebar sidebar-right">
      <h3 class="side-title" data-i18n="home.contacts">Người liên hệ</h3>
      <div id="friendsList"></div>
    </aside>

  </div>

  <script src="translations.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
