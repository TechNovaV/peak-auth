<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quên mật khẩu - PEAK!</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="peak-body">
    <main class="peak-split">
      <section class="peak-art" aria-hidden="true">
        <img src="images/left-bg.png" alt="" class="peak-art-img" draggable="false" />
      </section>

      <section class="peak-form-wrap">
        <div class="peak-card">
          <header class="peak-card-header">
            <img src="images/peak-logo.png" alt="PEAK!" class="peak-logo-img" />
            <p class="peak-subtitle" data-i18n="forgot.subtitle">Đặt lại mật khẩu</p>
          </header>

          <form class="auth-form" id="forgotForm" novalidate>
            <p class="peak-desc" data-i18n="forgot.desc">Nhập email đăng ký. Chúng tôi sẽ gửi link đặt lại mật khẩu.</p>

            <div class="field">
              <label for="email" data-i18n="field.email">Email</label>
              <input type="email" id="email" name="email" placeholder="ban@example.com" data-i18n-placeholder="placeholder.email" required autocomplete="email" />
              <small class="error" id="emailError"></small>
            </div>

            <button type="submit" class="btn-primary btn-neon" data-i18n="forgot.btn">Gửi link</button>

            <div id="successMsg" class="hidden peak-success"></div>

            <p class="auth-footer">
              <span data-i18n="forgot.remember">Nhớ mật khẩu rồi?</span>
              <a href="index.html" class="link link-neon" data-i18n="common.back_login">Quay lại đăng nhập</a>
            </p>
          </form>
        </div>
      </section>
    </main>

    <script src="translations.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
