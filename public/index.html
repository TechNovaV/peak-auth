<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - PEAK!</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Press+Start+2P&family=Righteous&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="peak-body">
    <main class="peak-split">
      <!-- ===== LEFT: ILLUSTRATION ===== -->
      <section class="peak-art" aria-hidden="true">
        <div class="peak-art-inner">
          <div class="peak-grid-floor"></div>

          <!-- pixel sparkles -->
          <span class="px-star px-star--a"></span>
          <span class="px-star px-star--b"></span>
          <span class="px-star px-star--c"></span>
          <span class="px-star px-star--d"></span>

          <!-- floating 3d shapes -->
          <span class="shape shape-cube shape-cube--1"></span>
          <span class="shape shape-cube shape-cube--2"></span>
          <span class="shape shape-cube shape-cube--3"></span>
          <span class="shape shape-pyramid"></span>
          <span class="shape shape-prism"></span>
          <span class="shape shape-bigstar"></span>

          <!-- center logo cluster -->
          <div class="peak-logo-cluster">
            <span class="node node-chat">💬</span>
            <span class="node node-share">⌬</span>
            <span class="node node-users">👥</span>

            <span class="link-line link-line--1"></span>
            <span class="link-line link-line--2"></span>
            <span class="link-line link-line--3"></span>

            <div class="peak-logo-circle">
              <span class="peak-logo-p">P</span>
            </div>
          </div>
        </div>
      </section>

      <!-- ===== RIGHT: FORM ===== -->
      <section class="peak-form-wrap">
        <div class="peak-card">
          <header class="peak-card-header">
            <h1 class="peak-logo">PEAK!</h1>
            <p class="peak-subtitle">Chào mừng quay trở lại</p>
          </header>

          <form class="auth-form" id="loginForm" novalidate>
            <div class="field">
              <label for="email">Email</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="ban@example.com"
                required
                autocomplete="email"
              />
              <small class="error" id="emailError"></small>
            </div>

            <div class="field">
              <label for="password">Mật khẩu</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Ít nhất 8 ký tự"
                minlength="8"
                required
                autocomplete="current-password"
              />
              <small class="error" id="passwordError"></small>
            </div>

            <div class="field-row">
              <label class="checkbox">
                <input type="checkbox" name="remember" />
                <span>Ghi nhớ tôi</span>
              </label>
              <a href="forgot.html" class="link link-neon">Quên mật khẩu?</a>
            </div>

            <button type="submit" class="btn-primary btn-neon">
              Đăng nhập
            </button>

            <p class="auth-footer">
              Chưa có tài khoản?
              <a href="register.html" class="link link-neon">Đăng ký ngay</a>
            </p>
          </form>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
