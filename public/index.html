<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - PEAK!</title>
    <link rel="icon" type="image/png" href="public/images/favicon.ico">
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="peak-body">
    <main class="peak-split">
      <!-- ===== LEFT: ILLUSTRATION ===== -->
      <section class="peak-art" aria-hidden="true">
        <img src="images/left-bg.png" alt="" class="peak-art-img" draggable="false" />
      </section>

      <!-- ===== RIGHT: FORM ===== -->
      <section class="peak-form-wrap">
        <div class="peak-card">
          <header class="peak-card-header">
            <img src="images/peak-logo.png" alt="PEAK!" class="peak-logo-img" draggable="false" />
          </header>

          <form class="auth-form" id="loginForm" novalidate>
            <div class="field">
              <label for="email" data-i18n="field.email">Email</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="ban@example.com"
                data-i18n-placeholder="placeholder.email"
                required
                autocomplete="email"
              />
              <small class="error" id="emailError"></small>
            </div>

            <div class="field">
              <label for="password" data-i18n="field.password">Mật khẩu</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Ít nhất 8 ký tự"
                data-i18n-placeholder="placeholder.password"
                minlength="8"
                required
                autocomplete="current-password"
              />
              <small class="error" id="passwordError"></small>
            </div>

            <div class="field-row">
              <label class="checkbox">
                <input type="checkbox" name="remember" />
                <span data-i18n="login.remember">Ghi nhớ đăng nhập</span>
              </label>
              <a href="forgot.html" class="link link-neon" data-i18n="login.forgot">Quên mật khẩu?</a>
            </div>

            <button type="submit" class="btn-primary btn-neon" data-i18n="login.btn">
              Đăng nhập
            </button>

            <p class="auth-footer">
              <span data-i18n="login.no_account">Chưa có tài khoản?</span>
              <a href="register.html" class="link link-neon" data-i18n="login.register_link">Đăng ký ngay</a>
            </p>
          </form>
        </div>
      </section>
    </main>

    <script src="translations.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
